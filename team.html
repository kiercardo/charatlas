<!-- @dsCard group="Website" viewport="1280x900" name="CharAtlas — Founders" subtitle="Team page: Riccardo (market), Omar (matching engine), Konstantina (methodology). EN/IT." -->
<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Founders · CharAtlas</title>
<link rel="icon" href="../assets/logomark-green.svg">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../ui_kits/website/site.css">
<link rel="stylesheet" href="./beta.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="./i18n.js"></script>
<script src="./founders-img.js"></script>
<script src="./motion.js"></script>
<script type="text/babel" src="../ds-runtime.jsx"></script>
<script type="text/babel" src="./brand.jsx"></script>
<script type="text/babel" src="./sections.jsx"></script>
<style>html,body{margin:0}</style>
</head><body>
<template id="__bundler_thumbnail" data-bg-color="#0f1a14">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#0f1a14"/>
    <g stroke="#1f3a2c" stroke-width="2">
      <path d="M0 200 H1200 M0 400 H1200 M0 600 H1200 M300 0 V800 M600 0 V800 M900 0 V800"/>
    </g>
    <g fill="none" stroke="#f2ede4" stroke-width="18">
      <path d="M440 500 V440 H500"/>
      <path d="M700 440 H760 V500"/>
      <path d="M760 260 V200 H700"/>
      <path d="M500 200 H440 V260"/>
    </g>
    <g fill="none" stroke="#f2ede4" stroke-width="9">
      <path d="M600 190 V510"/>
      <path d="M430 350 H770"/>
    </g>
    <circle cx="600" cy="350" r="26" fill="#4ade80"/>
  </svg>
</template>
<div id="root"></div>
<script type="text/babel" data-presets="react">
  const CAX = window.CharAtlasDesignSystem_9427fe;
  function TeamPage() {
    const t = window.useT();
    return (
      <main>
        <section className="bio-hero">
          <div className="site-hero__grid cax-mapgrid"></div>
          <div className="site__wrap">
            <div className="cax-eyebrow" style={{ marginBottom: 'var(--space-5)' }}>{t('team.eyebrow')}</div>
            <h1>{t('team.h1')}</h1>
            <p className="lede">{t('team.lede')}</p>
          </div>
        </section>
        <section className="site-sec" id="team">
          <div className="site__wrap">
            <div className="team-grid">
              {t('team.members').map((m) => (
                <div className="team-card" key={m.name}>
                  <div className="team-card__photo">{m.img ? <img src={(window.FOUNDER_IMGS && window.FOUNDER_IMGS[m.img.replace(/^founders\//, '').replace(/\.jpg$/, '')]) || m.img} alt={m.name} /> : <span>{m.init}</span>}</div>
                  <h3>{m.name}</h3>
                  <span className="team-card__role">{m.role}</span>
                  <p>{m.bio}</p>
                  <div className="team-card__tags">
                    {m.tags.map((tg) => <CAX.Badge key={tg} tone="neutral">{tg}</CAX.Badge>)}
                  </div>
                </div>
              ))}
            </div>
            <div className="team-cta">
              <div>
                <h2>{t('team.ctaH')}</h2>
                <p>{t('team.ctaP')}</p>
              </div>
              <div className="site-hero__cta" style={{ margin: 0 }}>
                <CAX.Button size="lg" trailingIcon={<i data-lucide="arrow-right"></i>} onClick={() => { window.location.href = 'landing.html'; }}>{t('team.cta1')}</CAX.Button>
                <CAX.Button size="lg" variant="secondary" onClick={() => { window.location.href = 'mailto:hello@charatlas.eu'; }}>{t('team.cta2')}</CAX.Button>
              </div>
            </div>
          </div>
        </section>
      </main>
    );
  }
  function Shell() {
    const t = window.useT();
    const [reqOpen, setReqOpen] = React.useState(false);
    React.useEffect(() => { window.lucide && window.lucide.createIcons(); });
    React.useEffect(() => { document.title = t('team.metaTitle'); });
    return (
      <div className="site" id="top" data-surface="white">
        <window.SiteNav here="team" onRequest={() => setReqOpen(true)} />
        <TeamPage />
        <window.SiteFooter onRequest={() => setReqOpen(true)} />
        <window.RequestAccessModal open={reqOpen} onClose={() => setReqOpen(false)} />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(
    <window.BrandProvider><Shell /></window.BrandProvider>
  );
</script>
</body></html>
