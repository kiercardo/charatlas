<template id="__bundler_thumbnail" data-bg-color="#0f1a14">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#0f1a14"/>
    <g stroke="#1f3a2c" stroke-width="2"><path d="M0 200 H1200 M0 400 H1200 M0 600 H1200 M300 0 V800 M600 0 V800 M900 0 V800"/></g>
    <path d="M240 600 L440 470 L640 500 L840 300 L960 240" fill="none" stroke="#4ade80" stroke-width="18" stroke-linejoin="round"/>
    <circle cx="960" cy="240" r="34" fill="#f2ede4"/>
  </svg>
</template>
<div id="root"></div>
<script type="text/babel" data-presets="react">
  function Shell() {
    const t = window.useT();
    const [reqOpen, setReqOpen] = React.useState(false);
    React.useEffect(() => { window.lucide && window.lucide.createIcons(); });
    React.useEffect(() => { document.title = t('apps.metaTitle'); });
    return (
      <div className="site" id="top" data-surface="white">
        <window.SiteNav here="apps" onRequest={() => setReqOpen(true)} />
        <window.AppsPage />
        <window.SiteFooter onRequest={() => setReqOpen(true)} />
        <window.RequestAccessModal open={reqOpen} onClose={() => setReqOpen(false)} />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(
    <window.BrandProvider><Shell /></window.BrandProvider>
  );
</script>
