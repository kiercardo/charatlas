<!-- @dsCard group="Website" viewport="1280x800" name="CharAtlas — Early-access landing" subtitle="Email-capture landing page with affiliations strip. EN/IT." -->
<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CharAtlas — Early access</title>
<link rel="icon" href="../assets/logomark-green.svg">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../ui_kits/website/site.css">
<link rel="stylesheet" href="./beta.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="./i18n.js"></script>
<script src="./motion.js"></script>
<script src="./image-slot.js"></script>
<script type="text/babel" src="../ds-runtime.jsx"></script>
<script type="text/babel" src="./brand.jsx"></script>
<script type="text/babel" src="./tweaks-panel.jsx"></script>
<style>html,body{margin:0}</style>
</head><body>
<template id="__bundler_thumbnail" data-bg-color="#0f1a14"><svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><rect width="1200" height="800" fill="#0f1a14"/><g fill="none" stroke="#f2ede4" stroke-width="18"><path d="M440 500 V440 H500"/><path d="M700 440 H760 V500"/><path d="M760 360 V300 H700"/><path d="M500 300 H440 V360"/></g><circle cx="600" cy="400" r="42" fill="#1e7d3a"/></svg></template>
<div id="root"></div>
<script type="text/babel" data-presets="react">
  const CAX = window.CharAtlasDesignSystem_9427fe;
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "layout": "left",
    "showAffiliations": true,
    "showGrid": true,
    "showExitLinks": true
  }/*EDITMODE-END*/;
  function Landing() {
    const [tw, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
    const t = window.useT();
    const [email, setEmail] = React.useState('');
    const [err, setErr] = React.useState(null);
    const [sent, setSent] = React.useState(false);
    const [busy, setBusy] = React.useState(false);
    React.useEffect(() => { window.lucide && window.lucide.createIcons(); });
    React.useEffect(() => { document.title = t('land.metaTitle'); });
    const submit = (e) => {
      e.preventDefault();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setErr(t('land.err')); return; }
      setErr(null);
      setBusy(true);
      fetch('https://formspree.io/f/mbdnqldz', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ form: 'waitlist', email }),
      }).then((r) => {
        if (r.ok) setSent(true);
        else setErr(t('land.errNet'));
      }).catch(() => setErr(t('land.errNet'))).finally(() => setBusy(false));
    };
    return (
      <div className="site land" data-surface="white" data-align={tw.layout}>
        {tw.showGrid && <div className="site-hero__grid cax-mapgrid"></div>}
        <header className="land__top site__wrap">
          <window.SiteLogo size={26} href={tw.showExitLinks ? 'index.html' : null} />
          <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--space-4)' }}>
            <window.LangToggle />
            {tw.showExitLinks && <a className="land__back" href="index.html">{t('land.back')} →</a>}
          </div>
        </header>
        <main className="land__main site__wrap">
          <div className="land__card">
            <div className="cax-eyebrow" style={{ marginBottom: 'var(--space-4)' }}>{t('land.eyebrow')}</div>
            <h1>{t('land.h1')}</h1>
            <p className="lede">{t('land.p')}</p>
            {sent ? (
              <div className="land__ok">
                <CAX.Badge tone="positive" dot>{t('land.okBadge')}</CAX.Badge>
                <h3>{t('land.okH')}</h3>
                <p>{t('land.okP')}</p>
              </div>
            ) : (
              <form className="land__form" onSubmit={submit} noValidate>
                <div className="land__row">
                  <CAX.Input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder={t('land.ph')} error={err} mono aria-label="Email" />
                  <CAX.Button type="submit" size="lg" disabled={busy} trailingIcon={<i data-lucide="arrow-right"></i>}>{busy ? '…' : t('land.btn')}</CAX.Button>
                </div>
                <span className="land__small">{t('land.small')}</span>
              </form>
            )}
            {tw.showAffiliations && <div className="site-affil land__affil">
              <span className="site-affil__lab">{t('affil.label')}</span>
              <div className="site-affil__list">
                {t('affil.items').map((a) => (
                  <div className="site-affil__item" key={a.n}>
                    <span className="site-affil__n">{a.n}</span>
                    <span className="site-affil__s">{a.s}</span>
                  </div>
                ))}
              </div>
            </div>}
          </div>
        </main>
        <footer className="land__foot site__wrap">
          <span className="cax-coord">© 2026 CHARATLAS · MILANO · DELFT · BERLIN</span>
          <a className="site-foot__mail" style={{ color: 'var(--text-muted)' }} href="mailto:hello@charatlas.eu">hello@charatlas.eu</a>
        </footer>
        <window.TweaksPanel>
          <window.TweakSection label="Layout" />
          <window.TweakRadio label="Alignment" value={tw.layout} options={['left', 'centered']} onChange={(v) => setTweak('layout', v)} />
          <window.TweakToggle label="Map-grid background" value={tw.showGrid} onChange={(v) => setTweak('showGrid', v)} />
          <window.TweakSection label="Content" />
          <window.TweakToggle label="Affiliations strip" value={tw.showAffiliations} onChange={(v) => setTweak('showAffiliations', v)} />
          <window.TweakToggle label="Links out to main site" value={tw.showExitLinks} onChange={(v) => setTweak('showExitLinks', v)} />
        </window.TweaksPanel>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(
    <window.BrandProvider><Landing /></window.BrandProvider>
  );
</script>
</body></html>
